<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123a5c">
<title>Presensi Rapat SMPIA 51</title>
<link rel="icon" id="fav" href="data:,">
<style>
:root{
  --navy:#123a5c;--blue:#1f6fa1;--blue-light:#e8f2f9;--gold:#c9a961;--gold-soft:#f6efe0;
  --bg:#f4f7fa;--card:#fff;--text:#1c2b36;--muted:#66788a;--border:#dde6ee;
  --ok:#2e9e5b;--ok-soft:#e5f4eb;--warn:#b7791f;--danger:#c0392b;--danger-soft:#fdecea;
  --radius:14px;--shadow:0 2px 10px rgba(18,58,92,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
[hidden]{display:none!important}

/* ---------- Topbar ---------- */
.topbar{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:sticky;top:0;z-index:40}
.topbar .logo-ypi{height:34px;width:34px;border-radius:50%;background:#fff;padding:2px}
.topbar .logo-aaiibs{height:30px;filter:brightness(0) invert(1)}
.topbar .brand{font-weight:700;font-size:15px;line-height:1.2;min-width:0}
.topbar .brand small{display:block;font-weight:400;font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar nav{margin-left:auto;display:flex;gap:6px}
.topbar nav a{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);cursor:pointer;white-space:nowrap}
.topbar nav a.active,.topbar nav a:hover{background:#fff;color:var(--navy)}
@media(max-width:520px){.topbar .logo-aaiibs{display:none}.topbar nav a{padding:7px 10px;font-size:12px}}

.wrap{max-width:980px;margin:0 auto;padding:20px 16px 70px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
h3{font-size:15px;margin:0 0 8px;color:var(--navy)}
.lead{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- Hero ---------- */
.hero{border-radius:var(--radius);overflow:hidden;position:relative;background:linear-gradient(160deg,var(--navy) 0%,var(--blue) 62%,#2a86b8 100%);color:#fff;padding:30px 22px 26px;text-align:center;margin-bottom:18px;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;border:28px solid rgba(201,169,97,.18)}
.hero .logos{display:flex;justify-content:center;gap:20px;align-items:center;margin-bottom:14px;position:relative;z-index:1}
.hero .logos .ypi{height:58px;width:58px;border-radius:50%;background:#fff;padding:3px}
.hero .logos .aai{height:62px;filter:brightness(0) invert(1)}
.hero h1{color:#fff;font-size:24px;margin-bottom:6px;position:relative;z-index:1}
.hero p{color:rgba(255,255,255,.88);margin:0;position:relative;z-index:1}
.hero .gold-line{width:56px;height:3px;background:var(--gold);border-radius:2px;margin:12px auto 0}

/* ---------- Forms ---------- */
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:14px 0 6px}
label .opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;background:#fff;color:var(--text);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 14px}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text);cursor:pointer;margin-top:10px}
.check input{width:18px;height:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{background:var(--navy)}
.btn.block{width:100%;padding:14px}
.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.secondary:hover{background:var(--blue-light)}
.btn.gold{background:var(--gold);color:#fff}
.btn.gold:hover{background:#b8954a}
.btn.danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.ghost{background:transparent;color:var(--blue);padding:8px 10px}
.btn.ghost:hover{background:var(--blue-light)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-row.right{justify-content:flex-end}

/* ---------- Combobox ---------- */
.combo{position:relative}
.combo-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 24px rgba(18,58,92,.16);max-height:260px;overflow-y:auto;z-index:60;display:none}
.combo-panel.open{display:block}
.combo-opt{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f3f6;display:flex;justify-content:space-between;gap:8px}
.combo-opt:last-child{border-bottom:none}
.combo-opt:hover,.combo-opt.hi{background:var(--blue-light)}
.combo-opt.dis{color:#a5b2be;cursor:not-allowed;background:#fafbfc}
.combo-opt .tag{font-size:11px;color:var(--ok);font-weight:700;white-space:nowrap}
.combo-empty{padding:12px;font-size:13px;color:var(--muted);text-align:center}

/* ---------- Signature ---------- */
.sig-wrap{position:relative;border:2px dashed #b9c9d8;border-radius:12px;background:#fbfdff;touch-action:none}
.sig-wrap canvas{display:block;width:100%;height:190px;border-radius:12px;cursor:crosshair;touch-action:none}
.sig-wrap .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a5b6c6;font-size:14px;pointer-events:none}
.sig-wrap .base{position:absolute;left:18px;right:18px;bottom:38px;border-bottom:1px solid #d6e1ea;pointer-events:none}
.sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* ---------- Lists ---------- */
.rapat-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
.rapat-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(18,58,92,.13)}
.date-badge{flex:0 0 58px;text-align:center;background:var(--blue-light);border-radius:10px;padding:8px 4px;color:var(--navy)}
.date-badge b{display:block;font-size:22px;line-height:1}
.date-badge span{font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.rapat-card .body{flex:1;min-width:0}
.rapat-card .title{font-weight:700;color:var(--navy);font-size:15px;margin-bottom:3px}
.rapat-card .meta{font-size:12.5px;color:var(--muted);line-height:1.6}
.rapat-card .side{text-align:right;flex:0 0 auto}
@media(max-width:520px){.rapat-card{flex-wrap:wrap}.rapat-card .body{flex:1 1 calc(100% - 74px)}.rapat-card .side{flex:1 1 100%;display:flex;align-items:center;gap:12px;padding-left:72px;text-align:left}.rapat-card .side .count{margin:0}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.buka{background:var(--ok-soft);color:var(--ok)}
.pill.tutup{background:#eceff2;color:#6b7785}
.pill.gold{background:var(--gold-soft);color:#8a6a24}
.count{font-size:12px;color:var(--muted);margin-top:6px}
.count b{color:var(--navy);font-size:15px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:640px){.stat-grid{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat .n{font-size:22px;font-weight:800;color:var(--navy)}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:2px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input{flex:1;min-width:180px}

/* ---------- Detail ---------- */
.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.detail-head .meta{color:var(--muted);font-size:13px;line-height:1.7;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin:6px 0 16px;overflow-x:auto}
.tabs button{border:none;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:13.5px;white-space:nowrap}
.tabs button.active{color:var(--navy);border-bottom-color:var(--gold)}
.tabs button .n{display:inline-block;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--blue-light);color:var(--navy);font-size:11px;margin-left:4px}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--blue-light);color:var(--navy);text-align:left;padding:9px 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em}
tbody td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.table-wrap{overflow-x:auto}
td img.ttd{height:44px;max-width:130px;object-fit:contain}
td .nottd{color:#b0bcc7;font-size:12px;font-style:italic}

.belum{margin-top:14px;border:1px dashed var(--border);border-radius:10px;padding:10px 14px;background:#fcfdfe}
.belum summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:13px}
.belum ul{columns:2;margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
@media(max-width:600px){.belum ul{columns:1}}

.dok-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.dok-item{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}
.dok-item .img{aspect-ratio:4/3;background:#eef3f7;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.dok-item img{width:100%;height:100%;object-fit:cover;display:block}
.dok-item .cap{padding:8px 10px;font-size:12.5px}
.dok-item .cap input{font-size:12.5px;padding:6px 8px}
.dok-item .act{display:flex;justify-content:space-between;padding:0 6px 8px}

.dropzone{border:2px dashed #b9c9d8;border-radius:12px;padding:22px;text-align:center;background:#fbfdff;cursor:pointer;color:var(--muted)}
.dropzone:hover{background:var(--blue-light)}
.dropzone b{color:var(--navy)}

/* ---------- Misc ---------- */
.notice{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;line-height:1.5}
.notice.info{background:var(--blue-light);color:var(--navy)}
.notice.warn{background:#fff6e5;color:#7a5410;border:1px solid #f1dcae}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.notice.ok{background:var(--ok-soft);color:#1f6e40}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.success{text-align:center;padding:26px 10px}
.success .tick{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 12px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid #c7d6e3;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.btn .spin{border-color:rgba(255,255,255,.4);border-top-color:#fff;width:15px;height:15px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:200;display:none;max-width:92vw;text-align:center}
.toast.show{display:block}
.toast.err{background:var(--danger)}
.footer-note{text-align:center;color:var(--muted);font-size:11.5px;margin-top:22px}
.demo-bar{background:var(--gold-soft);color:#7a5c1c;font-size:12.5px;text-align:center;padding:7px 12px;border-bottom:1px solid #ecdcb8}

.modal-bg{position:fixed;inset:0;background:rgba(12,32,52,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.modal .mh h2{margin:0}
.modal .x{border:none;background:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
.qr-box{display:flex;justify-content:center;padding:14px}
.linkbox{display:flex;gap:8px}
.linkbox input{font-size:12.5px}
</style>

   UTIL
   ========================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function parseTgl(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function fmtTgl(s){ const d=parseTgl(s); return d?`${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`:'-'; }
function fmtTglPendek(s){ const d=parseTgl(s); return d?`${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`:'-'; }
function jam(r){ return r.mulai ? (r.mulai + (r.selesai ? '\u2013' + r.selesai : '') + ' WIB') : ''; }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function nowStr(){ const d=new Date(); return todayStr()+' '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'); }
function fmtWaktu(s){ return (s||'').slice(11,16); }
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }

function toast(msg, err){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast', err?4500:2600); }
function loading(text='Memuat data\u2026'){ return `<div class="loading"><span class="spin"></span>${esc(text)}</div>`; }
function busy(btn, on, text){ if(!btn) return; if(on){ btn._html=btn.innerHTML; btn.disabled=true; btn.innerHTML=`<span class="spin"></span>${esc(text||'Menyimpan\u2026')}`; } else { btn.disabled=false; if(btn._html) btn.innerHTML=btn._html; } }

function modal(html, onMount){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) close(); });
  $$('[data-close]',bg).forEach(b=>b.onclick=close);
  onMount && onMount(bg, close);
  return close;
}
function confirmBox(msg, okText='Ya, lanjutkan', danger=true){
  return new Promise(res=>{
    modal(`<div class="mh"><h2>Konfirmasi</h2><button class="x" data-close>&times;</button></div>
      <p style="line-height:1.6">${msg}</p>
      <div class="btn-row right"><button class="btn secondary" data-close>Batal</button><button class="btn ${danger?'danger':''}" id="cfOk">${esc(okText)}</button></div>`,
      (bg,close)=>{ $$('[data-close]',bg).forEach(b=>b.addEventListener('click',()=>res(false))); $('#cfOk',bg).onclick=()=>{close();res(true);}; });
  });
}

/* ==========================================================
   API (JSONP untuk baca, POST + cek opId untuk simpan)
   ========================================================== */
const DEMO = !API_URL;
class ServerError extends Error {}

function jsonp(params){
  return new Promise((res, rej)=>{
    const cb='__pr'+uid().replace(/\W/g,'');
    const s=document.createElement('script');
    const q=new URLSearchParams({...params, callback:cb, _:Date.now()});
    const t=setTimeout(()=>{ cleanup(); rej(new Error('Server tidak merespons. Cek koneksi internet.')); }, 60000);
    function cleanup(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove(); }
    window[cb]=d=>{ cleanup(); if(d&&d.ok) res(d.data); else rej(new ServerError((d&&d.error)||'Terjadi kesalahan di server.')); };
    s.onerror=()=>{ cleanup(); rej(new Error('Gagal terhubung ke server.')); };
    s.src=API_URL+'?'+q.toString();
    document.head.appendChild(s);
  });
}

async function apiGet(action, params={}){
  if(DEMO) return Mock.get(action, params);
  return jsonp({action, ...params});
}

async function apiPost(action, body={}){
  if(DEMO) return Mock.post(action, body);
  const opId=uid();
  const payload=JSON.stringify({action, opId, ...body});
  try{
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload,redirect:'follow'});
    const d=await r.json();
    if(!d.ok) throw new ServerError(d.error||'Gagal menyimpan.');
    return d.data;
  }catch(err){
    if(err instanceof ServerError) throw err;
    // Cadangan bila respons POST terblokir CORS: kirim tanpa membaca respons, lalu cek hasilnya lewat JSONP.
    try{ await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload}); }catch(e){}
    for(let i=0;i<15;i++){
      await sleep(i<3?1200:2000);
      try{
        const c=await jsonp({action:'checkOp', opId});
        if(c){ if(c.ok) return c.data; throw new ServerError(c.error||'Gagal menyimpan.'); }
      }catch(e2){ if(e2 instanceof ServerError) throw e2; }
    }
    throw new Error('Belum bisa memastikan data terkirim. Periksa koneksi, lalu muat ulang halaman.');
  }
}

/* ==========================================================
   KOMPONEN: Combobox nama (bisa dicari)
   ========================================================== */
function makeCombo(wrap, opts){
  // opts: {items:[{nama,sub}], placeholder, value, disabled:Set(norm), onChange}
  wrap.classList.add('combo');
  wrap.innerHTML=`<input type="text" autocomplete="off" placeholder="${esc(opts.placeholder||'Ketik untuk mencari nama\u2026')}"><div class="combo-panel"></div>`;
  const input=$('input',wrap), panel=$('.combo-panel',wrap);
  let value=opts.value||'', hi=-1, shown=[];
  input.value=value;
  const dis=()=>opts.disabled||new Set();
  function render(){
    const q=norm(input.value);
    shown=opts.items.filter(it=>!q||norm(it.nama).includes(q)||(q.split(' ').every(w=>norm(it.nama).includes(w))));
    if(!shown.length){ panel.innerHTML=`<div class="combo-empty">Nama tidak ditemukan${opts.allowFree?' \u2014 centang \u201cNama saya tidak ada di daftar\u201d':''}</div>`; return; }
    panel.innerHTML=shown.map((it,i)=>{ const d=dis().has(norm(it.nama)); return `<div class="combo-opt${d?' dis':''}${i===hi?' hi':''}" data-i="${i}"><span>${esc(it.nama)}</span>${d?'<span class="tag">\u2713 sudah hadir</span>':(it.sub?`<span class="muted small">${esc(it.sub)}</span>`:'')}</div>`; }).join('');
  }
  function open(){ render(); panel.classList.add('open'); }
  function close(){ panel.classList.remove('open'); hi=-1; }
  function pick(i){ const it=shown[i]; if(!it||dis().has(norm(it.nama))) return; value=it.nama; input.value=value; close(); opts.onChange&&opts.onChange(value); }
  input.addEventListener('focus',()=>{ input.select(); open(); });
  input.addEventListener('input',()=>{ value=''; hi=-1; open(); opts.onChange&&opts.onChange(''); });
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); hi=Math.min(hi+1,shown.length-1); render(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hi=Math.max(hi-1,0); render(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(hi>=0) pick(hi); else if(shown.length===1) pick(0); }
    else if(e.key==='Escape') close();
  });
  input.addEventListener('blur',()=>setTimeout(()=>{ close(); if(!value) input.value=''; },180));
  panel.addEventListener('mousedown',e=>{ const o=e.target.closest('.combo-opt'); if(o){ e.preventDefault(); pick(+o.dataset.i); } });
  return { get value(){ return value; }, set(v){ value=v||''; input.value=value; }, input, refresh(){ if(panel.classList.contains('open')) render(); } };
}

/* ==========================================================
   KOMPONEN: Pad tanda tangan
   ========================================================== */
function makeSigPad(wrap){
  wrap.classList.add('sig-wrap');
  wrap.innerHTML=`<canvas></canvas><div class="base"></div><div class="hint">Tanda tangan di sini</div>`;
  const cv=$('canvas',wrap), hint=$('.hint',wrap), ctx=cv.getContext('2d');
  let drawing=false, empty=true, last=null, strokes=[];
  function resize(){
    const r=cv.getBoundingClientRect(), dpr=Math.max(1,window.devicePixelRatio||1);
    if(!r.width) return;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); redraw();
  }
  function style(){ ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0b2545'; }
  function redraw(){ ctx.clearRect(0,0,cv.width,cv.height); style(); strokes.forEach(s=>{ for(let i=1;i<s.length;i++) seg(s[i-1],s[i]); if(s.length===1) dot(s[0]); }); }
  function seg(a,b){ ctx.lineWidth=b.w; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  function dot(a){ ctx.fillStyle='#0b2545'; ctx.beginPath(); ctx.arc(a.x,a.y,1.4,0,Math.PI*2); ctx.fill(); }
  function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}; }
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; const p=pos(e); p.w=2.4; last=p; strokes.push([p]); style(); dot(p); empty=false; hint.hidden=true; });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; evs.forEach(ev=>{ const p=pos(ev); const d=Math.hypot(p.x-last.x,p.y-last.y); const v=d/Math.max(1,p.t-last.t); p.w=Math.max(1.3,Math.min(3,3.1-v*1.1)); p.w=(p.w+last.w)/2; seg(last,p); strokes[strokes.length-1].push(p); last=p; }); });
  const end=e=>{ drawing=false; last=null; };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
  window.addEventListener('resize',resize);
  setTimeout(resize,0);
  return {
    isEmpty:()=>empty,
    clear(){ strokes=[]; empty=true; hint.hidden=false; redraw(); },
    toDataURL(){
      if(empty) return '';
      const w=cv.width,h=cv.height, data=ctx.getImageData(0,0,w,h).data;
      let x0=w,y0=h,x1=0,y1=0;
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(data[(y*w+x)*4+3]>10){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
      if(x1<=x0||y1<=y0) return '';
      const pad=8; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w,x1+pad); y1=Math.min(h,y1+pad);
      const cw=x1-x0, ch=y1-y0, sc=Math.min(1,500/cw,200/ch);
      const out=document.createElement('canvas'); out.width=Math.max(1,Math.round(cw*sc)); out.height=Math.max(1,Math.round(ch*sc));
      out.getContext('2d').drawImage(cv,x0,y0,cw,ch,0,0,out.width,out.height);
      return out.toDataURL('image/png');
    }
  };
}

/* Foto dokumentasi diperkecil sebelum dikirim (maks 1600 px, JPEG) */
function resizeImage(file, max=1600, q=0.82){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Gagal membaca file'));
    fr.onload=()=>{ const img=new Image(); img.onerror=()=>rej(new Error('File bukan gambar yang didukung')); img.onload=()=>{
      const sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q)); }; img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

const S = { pin: store('pr_pin')||'', peserta:[], kota:'Karanganyar' };
const app = $('#app');

function nav(active){ $('#navHome').classList.toggle('active',active==='home'); $('#navAdmin').classList.toggle('active',active==='admin'); }
/* Router internal: tidak bergantung pada perpindahan URL, jadi tetap jalan saat dibuka
   di pratinjau/iframe. URL hanya diperbarui bila browser mengizinkan. */
let ROUTE=(()=>{ try{ return location.hash||'#/'; }catch(e){ return '#/'; } })();
function setUrl(h, replace){ try{ if(location.hash!==h) history[replace?'replaceState':'pushState'](null,'',h); }catch(e){} }
function go(h){ ROUTE=h; setUrl(h); route(); }
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]'); if(!a||e.ctrlKey||e.metaKey||e.shiftKey) return;
  e.preventDefault(); go(a.getAttribute('href'));
});

async function route(){
  const h=ROUTE.replace(/^#/,'')||'/';
  const parts=h.split('/').filter(Boolean);
  window.scrollTo(0,0);
  try{
    if(parts[0]==='r' && parts[1]) { nav('home'); return await viewPresensi(decodeURIComponent(parts[1])); }
    if(parts[0]==='admin'){
      nav('admin');
      if(!S.pin && !(await tryPinless())) return viewLogin();
      if(parts[1]==='baru') return viewRapatForm(null);
      if(parts[1]){ if(!parts[2]||!CUR||CUR.rapat.id!==decodeURIComponent(parts[1])) CUR=null; return await viewDetail(decodeURIComponent(parts[1]), parts[2]||'hadir'); }
      return await viewAdmin();
    }
    nav('home'); return await viewHome();
  }catch(err){
    console.error(err);
    if(err instanceof ServerError && /PIN/.test(err.message)){ S.pin=''; store('pr_pin',null); toast('PIN tidak valid, silakan masuk ulang.',true); return viewLogin(); }
    app.innerHTML=`<div class="card"><div class="notice err">${esc(err.message||err)}</div><button class="btn secondary" onclick="route()">Coba lagi</button></div>`;
  }
}
let pinlessChecked=false;
async function tryPinless(){ if(pinlessChecked) return false; pinlessChecked=true; try{ await apiGet('login',{pin:''}); S.pin=' '; return true; }catch(e){ return false; } }
function syncFromUrl(){ try{ if(location.hash&&location.hash!==ROUTE){ ROUTE=location.hash; route(); } }catch(e){} }
window.addEventListener('hashchange',syncFromUrl); window.addEventListener('popstate',syncFromUrl);

function shareModal(r){
  const url=linkPresensi(r.id);
  modal(`<div class="mh"><h2>Bagikan Link Presensi</h2><button class="x" data-close>&times;</button></div>
    <p class="muted small" style="margin-top:0">${esc(r.nama)} \u00b7 ${esc(fmtTgl(r.tanggal))}</p>

      <button class="btn secondary sm" id="full">Tampilkan layar penuh (proyektor)</button></div>`,
  (bg)=>{

    $('#full',bg).onclick=()=>{

      document.body.appendChild(f); f.onclick=()=>f.remove();

  const belum=S.peserta.filter(p=>!hadirSet.has(norm(p.nama)));
  body.innerHTML=`<div class="toolbar" style="justify-content:space-between"><span class="muted">${list.length} orang hadir dari ${S.peserta.length} nama di daftar guru/karyawan</span>

    ${list.length?`<div class="table-wrap"><table><thead><tr><th>No</th><th>Nama</th><th>Peran</th><th>Tanda tangan</th><th>Waktu</th><th></th></tr></thead><tbody>
    ${list.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.nama)}</b>${p.oleh==='Admin'?'<div class="small muted">diinput admin</div>':''}</td>
      <td>${esc(p.peran||'-')}</td><td>${p.ttd?`<img class="ttd" src="${p.ttd}" alt="ttd">`:'<span class="nottd">tanpa TTD</span>'}</td>
      <td class="small muted">${esc(fmtWaktu(p.waktu))}</td>
      <td style="white-space:nowrap"><button class="btn ghost sm" data-edit="${esc(p.id)}" title="Ubah">\u270e</button><button class="btn ghost sm" style="color:var(--danger)" data-del="${esc(p.id)}" title="Hapus">\ud83d\uddd1</button></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">Belum ada yang presensi. Bagikan link/QR presensi ke peserta rapat.</div>'}
    ${belum.length?`<details class="belum"><summary>Belum presensi (${belum.length})</summary><ul>${belum.map(p=>`<li>${esc(p.nama)}</li>`).join('')}</ul></details>`:''}`;
  $('#reload').onclick=()=>{ body.innerHTML=loading(); refresh('hadir'); };
  $('#tambah').onclick=()=>presensiModal(null, hadirSet);
  $$('[data-del]',body).forEach(b=>b.onclick=async ()=>{
    const p=CUR.presensi.find(x=>x.id===b.dataset.del);
    if(!(await confirmBox(`Hapus <b>${esc(p.nama)}</b> dari daftar hadir?`,'Hapus'))) return;
    try{ await apiPost('deletePresensi',{pin:S.pin.trim(),id:p.id}); toast('Dihapus.'); CUR.presensi=CUR.presensi.filter(x=>x.id!==p.id); viewDetail(CUR.rapat.id,'hadir'); }catch(err){ toast(err.message,true); }
  });
  $$('[data-edit]',body).forEach(b=>b.onclick=()=>presensiModal(CUR.presensi.find(x=>x.id===b.dataset.edit), hadirSet));
}
function presensiModal(p, hadirSet){
  const edit=!!p;
  modal(`<div class="mh"><h2>${edit?'Ubah Presensi':'Tambah Peserta'}</h2><button class="x" data-close>&times;</button></div>
    ${edit?`<p style="margin:4px 0 0"><b>${esc(p.nama)}</b></p>`:`<p class="small muted" style="margin:0">Untuk peserta yang belum sempat presensi atau rapel rapat sebelumnya. TTD boleh kosong.</p>

    <label>${edit?'Ganti tanda tangan':'Tanda tangan'} <span class="opt">(opsional)</span></label><div id="mSig"></div>

    <div class="btn-row right"><button class="btn secondary" data-close>Batal</button><button class="btn" id="mSave">Simpan</button></div>`,
  (bg,close)=>{
    let cb=null;

      cb=makeCombo($('#mNama',bg),{items:S.peserta.map(x=>({nama:x.nama})),disabled:hadirSet,placeholder:'Pilih nama\u2026'});

    $('#mSave',bg).onclick=async e=>{
      const btn=e.currentTarget, peran=$('#mPeran',bg).value.trim(), ttd=pad.toDataURL();
      try{
        if(edit){ busy(btn,true); await apiPost('updatePresensi',{pin:S.pin.trim(),id:p.id,peran,ttd}); }

          const lain=$('#mLainChk',bg).checked, nama=(lain?$('#mLain',bg).value:cb.value).trim();

        }

      }catch(err){ busy(btn,false); toast(err.message,true); }
    };
  });

    for(let i=0;i<files.length;i++){
      $('#upInfo').innerHTML=`<span class="spin"></span> Mengunggah foto ${i+1} dari ${files.length}\u2026`;
      try{ const img=await resizeImage(files[i]); const res=await apiPost('uploadDok',{pin:S.pin.trim(),rapatId:CUR.rapat.id,img,ket:''}); CUR.imgs[res.id]=img; ok++; }
      catch(err){ toast(`Foto ${i+1}: ${err.message}`,true); }
    }
    toast(`${ok} foto terunggah.`); body.innerHTML=loading(); refresh('dok');
  };
  $$('.dok-item',body).forEach(async el=>{
    try{ const src=await loadDokImg(el.dataset.id); $('.img',el).innerHTML=`<img src="${src}" alt="">`; }catch(e){ $('.img',el).textContent='Gagal memuat'; }
  });
  $$('[data-ket]',body).forEach(inp=>inp.onchange=async ()=>{
    try{ await apiPost('updateDok',{pin:S.pin.trim(),id:inp.dataset.ket,ket:inp.value.trim()}); const d=CUR.dok.find(x=>x.id===inp.dataset.ket); if(d) d.ket=inp.value.trim(); toast('Keterangan disimpan.'); }catch(err){ toast(err.message,true); }
  });
  $$('[data-del]',body).forEach(b=>b.onclick=async ()=>{
    if(!(await confirmBox('Hapus foto dokumentasi ini?','Hapus'))) return;
    try{ await apiPost('deleteDok',{pin:S.pin.trim(),id:b.dataset.del}); CUR.dok=CUR.dok.filter(x=>x.id!==b.dataset.del); toast('Foto dihapus.'); viewDetail(CUR.rapat.id,'dok'); }catch(err){ toast(err.message,true); }
  });
}

/* ---- Tab: Info rapat ---- */
function tabInfo(body){
  const r=CUR.rapat;
  body.innerHTML=rapatFormHtml(r)+`<div class="btn-row" style="justify-content:space-between"><button class="btn danger" id="hapus">Hapus rapat</button><button class="btn" id="simpan">Simpan perubahan</button></div>`;
  const val=bindRapatForm(body,r);
  $('#simpan').onclick=async e=>{
    const v=val(); if(!v.nama) return toast('Nama rapat wajib diisi.',true);
    const btn=e.currentTarget; busy(btn,true);
    try{ const res=await apiPost('saveRapat',{pin:S.pin.trim(),rapat:{id:r.id,...v}}); CUR.rapat=res.rapat; toast('Info rapat disimpan.'); viewDetail(r.id,'info'); }
    catch(err){ busy(btn,false); toast(err.message,true); }
  };
  $('#hapus').onclick=async ()=>{
    if(!(await confirmBox(`Hapus rapat <b>${esc(r.nama)}</b> beserta seluruh daftar hadir, tanda tangan, dan dokumentasinya? Tindakan ini tidak bisa dibatalkan.`,'Hapus permanen'))) return;
    try{ await apiPost('deleteRapat',{pin:S.pin.trim(),id:r.id}); CUR=null; toast('Rapat dihapus.'); go('#/admin'); }catch(err){ toast(err.message,true); }
  };
}

function pdfModal(){
  modal(`<div class="mh"><h2>Export PDF</h2><button class="x" data-close>&times;</button></div>
    <p class="muted small" style="margin-top:0">${esc(CUR.rapat.nama)} \u00b7 ${esc(fmtTgl(CUR.rapat.tanggal))}</p>
    <label class="check"><input type="checkbox" id="pH" checked> Daftar hadir & tanda tangan (${CUR.presensi.length})</label>
    <label class="check"><input type="checkbox" id="pN" ${CUR.rapat.notulen?'checked':''}> Notulen rapat${CUR.rapat.notulen?'':' <span class="muted small">(belum diisi)</span>'}</label>
    <label class="check"><input type="checkbox" id="pD" ${CUR.dok.length?'checked':''}> Dokumentasi (${CUR.dok.length} foto)</label>
    <div class="btn-row right"><button class="btn secondary" data-close>Batal</button><button class="btn gold" id="go">\u2b07 Unduh PDF</button></div>`,
  (bg,close)=>{
    $('#go',bg).onclick=async e=>{
      const o={hadir:$('#pH',bg).checked,notulen:$('#pN',bg).checked,dok:$('#pD',bg).checked};
      if(!o.hadir&&!o.notulen&&!o.dok) return toast('Pilih minimal satu bagian.',true);
      const btn=e.currentTarget; busy(btn,true,'Menyiapkan\u2026');
      try{ await exportPdf(o); close(); }catch(err){ console.error(err); busy(btn,false); toast('Gagal membuat PDF: '+err.message,true); }
    };
  });
}

/* PDF dibuat langsung dengan jsPDF + AutoTable: rapi, tabel otomatis pindah halaman */
const NAVY=[18,58,92];
function imgSize(src){ return new Promise(res=>{ if(!src) return res(null); const i=new Image(); i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight}); i.onerror=()=>res(null); i.src=src; }); }
function imgFmt(src){ return /^data:image\/png/i.test(src)?'PNG':'JPEG'; }
function fitBox(sz,maxW,maxH){ if(!sz) return null; const s=Math.min(maxW/sz.w,maxH/sz.h); return {w:sz.w*s,h:sz.h*s}; }

async function exportPdf(o){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J) throw new Error('pustaka PDF belum termuat, cek koneksi lalu coba lagi');
  const r=CUR.rapat, pres=[...CUR.presensi].sort((a,b)=>(a.waktu||'').localeCompare(b.waktu||''));
  const doc=new J({unit:'mm',format:'a4',orientation:'portrait'});
  if(typeof doc.autoTable!=='function') throw new Error('pustaka tabel PDF belum termuat');
  const PW=210, PH=297, ML=18, MR=18, CW=PW-ML-MR, BOTTOM=280;
  const szYpi=await imgSize(LOGO_YPI), szAai=await imgSize(LOGO_AAIIBS);
  for(const p of pres) p._sz=await imgSize(p.ttd);
  let first=true;

  function newPage(){ if(!first) doc.addPage(); first=false; }
  function kop(){
    const a=fitBox(szYpi,22,22), b=fitBox(szAai,27,20);
    if(a) doc.addImage(LOGO_YPI,'PNG',ML,12,a.w,a.h);
    if(b) doc.addImage(LOGO_AAIIBS,'PNG',PW-MR-b.w,13+(20-b.h)/2,b.w,b.h);
    const cx=PW/2; doc.setTextColor(...NAVY);
    doc.setFont('times','bold'); doc.setFontSize(10.5); doc.text(SEKOLAH.yayasan,cx,16.5,{align:'center'});
    doc.setFontSize(14.5); doc.text(SEKOLAH.nama,cx,23,{align:'center'});
    doc.setTextColor(40); doc.setFont('times','italic'); doc.setFontSize(9.5); doc.text(SEKOLAH.sub,cx,27.8,{align:'center'});
    doc.setFont('times','normal'); doc.setFontSize(8.5);
    const al=doc.splitTextToSize(SEKOLAH.alamat,118); let y=31.8;
    al.forEach(l=>{ doc.text(l,cx,y,{align:'center'}); y+=3.6; });
    doc.text(SEKOLAH.kontak,cx,y,{align:'center'});
    const ly=Math.max(38.5,y+2.8);
    doc.setDrawColor(...NAVY); doc.setLineWidth(1); doc.line(ML,ly,PW-MR,ly); doc.setLineWidth(0.3); doc.line(ML,ly+1.4,PW-MR,ly+1.4);
    doc.setTextColor(0); return ly+8;
  }
  function title(t,y){ doc.setFont('times','bold'); doc.setFontSize(13); doc.setTextColor(0); doc.text(t,PW/2,y,{align:'center'}); const w=doc.getTextWidth(t); doc.setLineWidth(0.3); doc.setDrawColor(0); doc.line(PW/2-w/2,y+1,PW/2+w/2,y+1); return y+8; }
  function info(y){
    const rows=[['Nama Rapat',r.nama],['Hari, Tanggal',fmtTgl(r.tanggal)],['Waktu',jam(r)||'-'],['Tempat',r.tempat||'-'],['Pimpinan Rapat',r.pimpinan||'-'],['Notulis',r.notulis||'-']];
    doc.setFontSize(11);
    rows.forEach(([k,v])=>{ doc.setFont('times','normal'); doc.text(k,ML,y); doc.text(':',ML+32,y); const lines=doc.splitTextToSize(String(v),CW-36); doc.text(lines,ML+35,y); y+=5.4*lines.length; });
    return y+3;
  }
  function header(t){ newPage(); let y=kop(); y=title(t,y); return info(y); }
  function sub(t,y){ doc.setFont('times','bold'); doc.setFontSize(11.5); doc.setTextColor(...NAVY); doc.text(t,ML,y); doc.setTextColor(0); return y+6; }
  function paragraph(text,y,size=11){
    doc.setFont('times','normal'); doc.setFontSize(size); const lh=size*0.47;
    String(text).split('\n').forEach(par=>{
      const lines=par.trim()===''?['']:doc.splitTextToSize(par,CW);
      lines.forEach(l=>{ if(y>BOTTOM){ doc.addPage(); y=20; doc.setFont('times','normal'); doc.setFontSize(size); } doc.text(l,ML,y); y+=lh; });
    });
    return y;
  }
  function signs(y){
    if(y+48>BOTTOM){ doc.addPage(); y=25; }
    const ttdOf=n=>pres.find(x=>n&&norm(x.nama)===norm(n));
    const col=(cx,l1,l2,n)=>{
      doc.setFont('times','normal'); doc.setFontSize(11); doc.text(l1,cx,y,{align:'center'}); doc.text(l2,cx,y+5,{align:'center'});
      const p=ttdOf(n); const f=p&&p.ttd?fitBox(p._sz,48,20):null; if(f) doc.addImage(p.ttd,imgFmt(p.ttd),cx-f.w/2,y+8+(20-f.h)/2,f.w,f.h);
      const nm=n||'(.................................)'; doc.setFont('times','bold'); doc.text(nm,cx,y+33,{align:'center'});
      if(n){ const w=doc.getTextWidth(nm); doc.setLineWidth(0.25); doc.line(cx-w/2,y+33.8,cx+w/2,y+33.8); }
    };
    col(ML+38,'Mengetahui,','Pimpinan Rapat',r.pimpinan);
    col(PW-MR-38,(CUR.kota||'Karanganyar')+', '+fmtTglPendek(r.tanggal),'Notulis',r.notulis);
    return y+40;
  }

  if(o.hadir){
    let y=header('DAFTAR HADIR RAPAT');
    doc.autoTable({
      startY:y, margin:{left:ML,right:MR,top:18,bottom:20}, theme:'grid',
      head:[['No','Nama','Peran','Tanda Tangan']],
      body:pres.length?pres.map((p,i)=>[String(i+1),p.nama,p.peran||'','']):[['','(belum ada peserta)','','']],
      styles:{font:'times',fontSize:10.5,cellPadding:{top:2,bottom:2,left:2.5,right:2.5},valign:'middle',lineColor:[120,120,120],lineWidth:0.2,textColor:20},
      headStyles:{fillColor:NAVY,textColor:255,fontStyle:'bold',halign:'center',minCellHeight:8},
      bodyStyles:{minCellHeight:13},
      columnStyles:{0:{cellWidth:11,halign:'center'},2:{cellWidth:32},3:{cellWidth:60}},
      didDrawCell:d=>{
        if(d.section!=='body'||d.column.index!==3) return;
        const i=d.row.index, p=pres[i]; if(!p) return;
        const half=d.cell.width/2, left=i%2===0, x0=d.cell.x+(left?0:half);
        doc.setFont('times','normal'); doc.setFontSize(8); doc.setTextColor(80); doc.text((i+1)+'.',x0+1.5,d.cell.y+3.5); doc.setTextColor(0);
        if(p.ttd){ const f=fitBox(p._sz,half-6,d.cell.height-3); if(f) doc.addImage(p.ttd,imgFmt(p.ttd),x0+4+(half-6-f.w)/2,d.cell.y+(d.cell.height-f.h)/2,f.w,f.h); }
      }
    });
    y=doc.lastAutoTable.finalY+6;
    doc.setFont('times','normal'); doc.setFontSize(11); doc.text(`Jumlah hadir: ${pres.length} orang`,ML,y);
    if(!o.notulen) signs(y+10);
  }
  if(o.notulen){
    let y=header('NOTULEN RAPAT');
    if(r.agenda){ y=sub('Agenda',y); y=paragraph(r.agenda,y)+3; }
    y=sub('Hasil Rapat',y);
    y=paragraph(r.notulen||'(Notulen belum diisi)',y);
    signs(y+10);
  }
  if(o.dok){
    const items=[];
    for(const d of CUR.dok){ try{ const img=await loadDokImg(d.id); items.push({ket:d.ket,img,sz:await imgSize(img)}); }catch(e){} }
    if(items.length){
      let y=header('DOKUMENTASI RAPAT');
      const gap=6, bw=(CW-gap)/2, bh=bw*0.75;
      items.forEach((it,i)=>{
        const c=i%2; if(c===0&&i>0) y+=bh+12;
        if(c===0&&y+bh+10>BOTTOM){ doc.addPage(); y=20; }
        const x=ML+c*(bw+gap);
        doc.setFillColor(243,245,247); doc.setDrawColor(200); doc.setLineWidth(0.2); doc.rect(x,y,bw,bh,'FD');
        const f=fitBox(it.sz,bw-2,bh-2); if(f) doc.addImage(it.img,imgFmt(it.img),x+(bw-f.w)/2,y+(bh-f.h)/2,f.w,f.h);
        if(it.ket){ doc.setFont('times','italic'); doc.setFontSize(9.5); doc.text(doc.splitTextToSize(it.ket,bw).slice(0,2),x+bw/2,y+bh+4.5,{align:'center'}); }
      });
    }
  }
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(130);
    doc.text(`Presensi Rapat \u00b7 ${r.nama.slice(0,70)} \u00b7 ${fmtTglPendek(r.tanggal)}`,ML,PH-9); doc.text(`Hal. ${i}/${n}`,PW-MR,PH-9,{align:'right'}); }
  const fname=`Rapat ${r.tanggal} ${r.nama}`.replace(/[\\/:*?"<>|]+/g,' ').slice(0,90)+'.pdf';
  doc.save(fname);
  toast('PDF diunduh.');
}
